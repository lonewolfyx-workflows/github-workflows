# 检测 release 分支的 PR 是否来自 main，不是则拒绝合并
name: chore

on:
  pull_request_target:
    branches:
      - release
    types:
      - opened
      - reopened
      - edited

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  enforce-source:
    if: github.repository == '{owner}/{repo}'
    runs-on: ubuntu-slim
    name: 🚦 Enforce release source
    steps:
      - name: Check PR is from main
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$HEAD_REPO" != "{owner}/{repo}" ] || [ "$HEAD_REF" != "main" ]; then
            echo "::error::PRs to 'release' must come from {owner}/{repo}:main (got ${HEAD_REPO}:${HEAD_REF})"
            exit 1
          fi
